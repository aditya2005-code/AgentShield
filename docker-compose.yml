version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agentshield_db
    restart: always
    environment:
      POSTGRES_USER: agentshield_user
      POSTGRES_PASSWORD: agentshield_password
      POSTGRES_DB: agentshield_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
